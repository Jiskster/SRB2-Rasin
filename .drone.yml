---
# DO NOT EDIT

kind: pipeline
type: docker
name: linux-amd64-binary

platform:
  arch: amd64
  os: linux

steps:
#- name: srb2-data-download
#  image: archlinux/archlinux:base-devel
#  commands:
#  - git clone https://aur.archlinux.org/srb2-data.git && cd srb2-data && makepkg -si

- name: update&build
  image: archlinux/archlinux:base-devel
  pull: if-not-exists
  commands:
  - pacman -Syu libgme libopenmpt libpng sdl2_mixer glu mesa nasm upx git --noconfirm
  - make -C src/ LINUX64=1 EXENAME=lsdl2srb2_x64_netplus -j $(grep -c processor /proc/cpuinfo)

- name: publish
  image: vividboarder/drone-webdav
  settings:
    file: bin/lsdl2srb2_x64_netplus
    destination:
      from_secret: upload_destination_linux
    username:
      from_secret: webdav_username
    password:
      from_secret: webdav_password

---

kind: pipeline
type: docker
name: windows-x86-binary

platform:
  arch: amd64
  os: linux

steps:

- name: update&build
  image: archlinux/archlinux:base-devel
  pull: if-not-exists
  commands:
  - pacman -Syu nasm upx git mingw-w64-binutils mingw-w64-crt mingw-w64-gcc mingw-w64-headers mingw-w64-winpthreads --noconfirm
  - env PREFIX=i686-w64-mingw32 make -C src/ NOUPX=1 MINGW=1 EXENAME=srb2win_netplus.exe -j $(grep -c processor /proc/cpuinfo)
  - make clean
  - rm make -rf
  - env PREFIX=i686-w64-mingw32 make -C src/ NOUPX=1 MINGW=1 HAVE_DISCORDRPC=1 EXENAME=srb2win_netplus_discordrpc.exe -j $(grep -c processor /proc/cpuinfo)

- name: publish
  image: vividboarder/drone-webdav
  settings:
    file: bin/srb2win_netplus.exe
    destination:
      from_secret: upload_destination_windowsx86
    username:
      from_secret: webdav_username
    password:
      from_secret: webdav_password

- name: publish_discordrpc
  image: vividboarder/drone-webdav
  settings:
    file: bin/srb2win_netplus_discordrpc.exe
    destination:
      from_secret: upload_destination_windowsx86
    username:
      from_secret: webdav_username
    password:
      from_secret: webdav_password


